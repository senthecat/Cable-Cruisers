# Live board updates → Discord
# Place this file at: .github/workflows/board-updates.yml in senthecat/Cable-Cruisers
#
# GitHub doesn't send "card moved" events for projects owned by a personal account,
# so this workflow checks the board every few minutes, compares it with the previous
# check, and posts only what changed:
#   • status changes (e.g. Todo → In Progress), with ✅ when something reaches Done
#   • someone assigned / unassigned
#   • items added to or removed from the board
# If nothing changed, it posts nothing.
#
# Uses the same secrets as project-digest.yml:
#   PROJECT_TOKEN        classic token with `read:project`
#   DISCORD_WEBHOOK_URL  Discord webhook (plain URL, no /github)
# Optional: DISCORD_UPDATES_WEBHOOK_URL — set this to send live updates to a different channel.
#
# Timing: cron-job.org calls this every 10 minutes (same setup as the digest, different URL/body):
#   POST https://api.github.com/repos/senthecat/Cable-Cruisers/actions/workflows/board-updates.yml/dispatches
#   body: {"ref":"main"}
# The GitHub schedule below is only a backup. Running twice is harmless: each run compares
# against the last saved snapshot, so the same change is never posted twice.

name: Board Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '7-59/15 * * * *'   # backup only; GitHub may delay or skip these

concurrency:
  group: board-updates          # one check at a time, so snapshots never race
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                # needed to save the snapshot cache

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Load previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: board-snapshot.json
          key: board-snapshot-${{ github.run_id }}
          restore-keys: board-snapshot-

      - name: Compare board and post changes
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          PROJECT_OWNER: senthecat
          PROJECT_NUMBER: '2'
          STATUS_FIELD: Status
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const fs = require('fs');
            const SNAP = 'board-snapshot.json';
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) { core.setFailed('DISCORD_WEBHOOK_URL secret is missing'); return; }
            if (webhook.endsWith('/github')) { core.setFailed('Use the plain Discord webhook URL, without /github'); return; }

            const login = process.env.PROJECT_OWNER;
            const number = parseInt(process.env.PROJECT_NUMBER, 10);
            const statusField = process.env.STATUS_FIELD.toLowerCase();

            // ---------- 1. Read the board now ----------
            const query = `
              query($login: String!, $number: Int!, $cursor: String) {
                user(login: $login) {
                  projectV2(number: $number) {
                    title
                    url
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        isArchived
                        content {
                          __typename
                          ... on Issue       { title url number state assignees(first: 10) { nodes { login } } }
                          ... on PullRequest { title url number state assignees(first: 10) { nodes { login } } }
                          ... on DraftIssue  { title assignees(first: 10) { nodes { login } } }
                        }
                        fieldValues(first: 30) {
                          nodes {
                            __typename
                            ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2FieldCommon { name } } }
                          }
                        }
                      }
                    }
                  }
                }
              }`;

            let project, cursor = null;
            const raw = [];
            do {
              const res = await github.graphql(query, { login, number, cursor });
              project = res.user && res.user.projectV2;
              if (!project) { core.setFailed(`Project #${number} not found for ${login} — check PROJECT_TOKEN has read:project`); return; }
              raw.push(...project.items.nodes);
              cursor = project.items.pageInfo.hasNextPage ? project.items.pageInfo.endCursor : null;
            } while (cursor);

            const now = {};
            for (const i of raw) {
              if (i.isArchived || !i.content || !i.content.title) continue;
              const c = i.content;
              let status = 'No Status';
              for (const fv of i.fieldValues.nodes) {
                if (fv.__typename === 'ProjectV2ItemFieldSingleSelectValue' && ((fv.field && fv.field.name) || '').toLowerCase() === statusField) status = fv.name;
              }
              now[i.id] = {
                title: c.title,
                url: c.url || null,
                number: c.number || null,
                state: c.state || 'OPEN',
                status,
                assignees: ((c.assignees && c.assignees.nodes) || []).map(a => a.login).sort(),
              };
            }

            // ---------- 2. Compare with the last check ----------
            let before = null;
            try { before = JSON.parse(fs.readFileSync(SNAP, 'utf8')); } catch (e) { /* first run */ }
            fs.writeFileSync(SNAP, JSON.stringify(now));

            if (!before) {
              core.info(`No previous snapshot — saved a baseline of ${Object.keys(now).length} items, nothing posted.`);
              return;
            }

            const short = (s, n = 70) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
            const label = x => (x.url ? `[${short(x.title)}](${x.url})` : `**${short(x.title)}** *(draft)*`);
            const isDone = x => /done|complete|closed|finished/i.test(x.status) || x.state === 'CLOSED' || x.state === 'MERGED';
            const who = x => (x.assignees.length ? ` (${x.assignees.join(', ')})` : '');

            const lines = [];
            for (const [id, x] of Object.entries(now)) {
              const old = before[id];
              if (!old) { lines.push(`🆕 ${label(x)} — added to the board${x.status !== 'No Status' ? ` in **${x.status}**` : ''}${who(x)}`); continue; }

              // Finished
              if (isDone(x) && !isDone(old)) lines.push(`✅ ${label(x)} — **finished**${who(x)}`);
              else if (!isDone(x) && isDone(old)) lines.push(`↩️ ${label(x)} — reopened, now **${x.status}**${who(x)}`);
              // Status move (not already reported as finished/reopened)
              else if (x.status !== old.status) {
                const icon = /progress|doing/i.test(x.status) ? '🔧' : /review|testing/i.test(x.status) ? '🔍' : /block|stuck|waiting/i.test(x.status) ? '⛔' : '➡️';
                lines.push(`${icon} ${label(x)} — ${old.status} → **${x.status}**${who(x)}`);
              }

              // Assignment changes
              const added = x.assignees.filter(a => !old.assignees.includes(a));
              const removed = old.assignees.filter(a => !x.assignees.includes(a));
              if (added.length) lines.push(`🙋 ${label(x)} — assigned to **${added.join(', ')}**`);
              if (removed.length) lines.push(`🚪 ${label(x)} — **${removed.join(', ')}** unassigned${x.assignees.length ? '' : ' · now has no owner'}`);

              // Renamed
              if (x.title !== old.title) lines.push(`✏️ ${label(x)} — renamed from "${short(old.title, 50)}"`);
            }
            for (const [id, old] of Object.entries(before)) {
              if (!now[id]) lines.push(`🗑️ ${label(old)} — removed or archived from the board`);
            }

            if (!lines.length) { core.info('No changes.'); return; }

            // ---------- 3. Post (split if very long) ----------
            const chunks = [];
            let cur = '';
            for (const l of lines) {
              if ((cur + '\n' + l).length > 3900) { chunks.push(cur); cur = l; } else cur = cur ? cur + '\n' + l : l;
            }
            if (cur) chunks.push(cur);

            const embeds = chunks.slice(0, 10).map((desc, n) => ({
              title: n === 0 ? `📋 ${project.title} — board update` : undefined,
              url: n === 0 ? project.url : undefined,
              description: desc,
              color: lines.some(l => l.startsWith('✅')) ? 0x2EA043 : 0x3B82F6,
              timestamp: n === chunks.length - 1 ? new Date().toISOString() : undefined,
            }));

            const resp = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: 'Cable Cruisers Bot', embeds, allowed_mentions: { parse: [] } }),
            });
            if (!resp.ok) {
              // Keep the old snapshot so these changes are retried next run
              fs.writeFileSync(SNAP, JSON.stringify(before));
              core.setFailed(`Discord returned ${resp.status}: ${await resp.text()}`);
              return;
            }
            core.info(`Posted ${lines.length} change(s).`);

      - name: Save snapshot
        if: always() && hashFiles('board-snapshot.json') != ''
        uses: actions/cache/save@v4
        with:
          path: board-snapshot.json
          key: board-snapshot-${{ github.run_id }}