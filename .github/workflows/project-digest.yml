# Weekly project-board digest → Discord
# Place this file at: .github/workflows/project-digest.yml in senthecat/Cable-Cruisers
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   PROJECT_TOKEN        Classic personal access token with the `read:project` scope
#                        (user-owned Projects can't be read by the default GITHUB_TOKEN)
#   DISCORD_WEBHOOK_URL  Discord channel webhook URL — the plain URL, WITHOUT /github
#
# Timing: GitHub's own `schedule:` trigger is best-effort and often runs late or not at all,
# so this workflow is started by an external timer (cron-job.org) calling the GitHub API:
#   POST https://api.github.com/repos/senthecat/Cable-Cruisers/actions/workflows/project-digest.yml/dispatches
#   Sunday 6:00 PM Pacific    body: {"ref":"main","inputs":{"mode":"full","automated":"true"}}
#   Wednesday 5:00 PM Pacific body: {"ref":"main","inputs":{"mode":"midweek","automated":"true"}}

name: Weekly Project Digest

on:
  workflow_dispatch: # started by cron-job.org on schedule, or manually from the Actions tab
    inputs:
      mode:
        description: 'full = weekly digest, midweek = unassigned / overdue / blocked only'
        type: choice
        options: [full, midweek]
        default: full
      automated:
        description: 'Set by the external timer so finals/break pauses apply (leave unchecked for manual runs)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Build and post digest
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PROJECT_OWNER: senthecat
          PROJECT_NUMBER: '2'
          STATUS_FIELD: Status                         # name of the board's column field
          DUE_FIELD_PATTERN: 'due|deadline|target|end' # date fields whose name matches count as due dates
          LOOKAHEAD_DAYS: '7'
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) { core.setFailed('DISCORD_WEBHOOK_URL secret is missing'); return; }
            if (webhook.endsWith('/github')) { core.setFailed('Use the plain Discord webhook URL here, without /github'); return; }

            // Pause scheduled posts during finals and breaks (manual "Run workflow" still posts)
            const blackouts = [
              ['2026-12-05', '2027-01-02'],   // fall finals + winter break
              ['2027-03-13', '2027-03-28'],   // winter finals + spring break
            ];
            const todayPT = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
            const inputs = context.payload.inputs || {};
            const automated = context.eventName === 'schedule' || String(inputs.automated) === 'true';
            if (automated && blackouts.some(([a, b]) => todayPT >= a && todayPT <= b)) {
              core.info(`Blackout period (${todayPT}), skipping`); return;
            }
            const isMidweek = inputs.mode === 'midweek';

            const login = process.env.PROJECT_OWNER;
            const number = parseInt(process.env.PROJECT_NUMBER, 10);
            const statusField = process.env.STATUS_FIELD.toLowerCase();
            const dueRe = new RegExp(process.env.DUE_FIELD_PATTERN, 'i');
            const lookahead = parseInt(process.env.LOOKAHEAD_DAYS, 10);
            const DAY = 86400000;

            // ---------- 1. Pull every item on the board ----------
            const query = `
              query($login: String!, $number: Int!, $cursor: String) {
                user(login: $login) {
                  projectV2(number: $number) {
                    title
                    url
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        isArchived
                        updatedAt
                        content {
                          __typename
                          ... on Issue       { title url number state closedAt assignees(first: 5) { nodes { login } } }
                          ... on PullRequest { title url number state closedAt assignees(first: 5) { nodes { login } } }
                          ... on DraftIssue  { title assignees(first: 5) { nodes { login } } }
                        }
                        fieldValues(first: 30) {
                          nodes {
                            __typename
                            ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2FieldCommon { name } } }
                            ... on ProjectV2ItemFieldDateValue         { date field { ... on ProjectV2FieldCommon { name } } }
                            ... on ProjectV2ItemFieldIterationValue    { title startDate duration field { ... on ProjectV2FieldCommon { name } } }
                          }
                        }
                      }
                    }
                  }
                }
              }`;

            let project, cursor = null;
            const raw = [];
            do {
              const res = await github.graphql(query, { login, number, cursor });
              project = res.user && res.user.projectV2;
              if (!project) { core.setFailed(`Project #${number} not found for ${login} — check PROJECT_TOKEN has read:project`); return; }
              raw.push(...project.items.nodes);
              const pi = project.items.pageInfo;
              cursor = pi.hasNextPage ? pi.endCursor : null;
            } while (cursor);

            // ---------- 2. Normalize ----------
            const today = new Date(); today.setUTCHours(0, 0, 0, 0);
            const horizon = new Date(today.getTime() + lookahead * DAY);
            const weekAgo = new Date(Date.now() - 7 * DAY);
            const short = (s, n = 60) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

            // Items whose content GitHub hides (e.g. an issue in a private repo the token can't read)
            const hidden = raw.filter(i => !i.isArchived && (!i.content || !i.content.title)).length;

            const items = raw.filter(i => !i.isArchived && i.content && i.content.title).map(i => {
              const c = i.content;
              let status = 'No Status', due = null, iteration = null;
              for (const fv of i.fieldValues.nodes) {
                const fname = (fv.field && fv.field.name) || '';
                if (fv.__typename === 'ProjectV2ItemFieldSingleSelectValue' && fname.toLowerCase() === statusField) status = fv.name;
                if (fv.__typename === 'ProjectV2ItemFieldDateValue' && dueRe.test(fname) && !due) due = new Date(fv.date + 'T00:00:00Z');
                if (fv.__typename === 'ProjectV2ItemFieldIterationValue' && !iteration) {
                  const start = new Date(fv.startDate + 'T00:00:00Z');
                  iteration = { title: fv.title, start, end: new Date(start.getTime() + fv.duration * DAY) };
                }
              }
              // "Current" = today falls inside the item's iteration window
              const inCurrentIteration = !!iteration && iteration.start <= today && today < iteration.end;
              const assignees = ((c.assignees && c.assignees.nodes) || []).map(a => a.login);
              const done = /done|complete|closed|finished/i.test(status) || c.state === 'CLOSED' || c.state === 'MERGED';
              const finishedAt = new Date(c.closedAt || i.updatedAt);
              const label = c.url ? `[#${c.number} ${short(c.title)}](${c.url})` : `${short(c.title)} *(draft)*`;
              return { status, due, assignees, done, finishedAt, label, iteration, inCurrentIteration };
            });

            // ---------- 3. Bucket (each open item lands in exactly ONE section) ----------
            const open = items.filter(i => !i.done);
            const byDue = (a, b) => (a.due || Infinity) - (b.due || Infinity);
            const isActive = i => /progress|doing|review|testing|block|stuck|waiting/i.test(i.status);

            // Closed = Done AND (in the current iteration, OR finished in the last 7 days, OR its end date was this week)
            const closed = items.filter(i => i.done && (
              i.inCurrentIteration ||
              i.finishedAt >= weekAgo ||
              (i.due && i.due >= weekAgo && i.due <= horizon)
            ));
            const currentIter = (items.find(i => i.inCurrentIteration) || {}).iteration;
            const closedTitle = currentIter ? `✅ Closed this iteration — ${currentIter.title}` : '✅ Closed this week';
            const overdue = [], inProgress = [], dueSoon = [], unassigned = [], upNext = [];
            for (const i of open) {
              if (!i.assignees.length) unassigned.push(i);            // no owner wins over everything else
              else if (i.due && i.due < today) overdue.push(i);
              else if (isActive(i)) inProgress.push(i);
              else if (i.due && i.due <= horizon) dueSoon.push(i);
              else upNext.push(i);          // assigned, not started, nothing due this week
            }
            [overdue, inProgress, dueSoon, unassigned, upNext].forEach(a => a.sort(byDue));

            const counts = new Map();
            for (const i of items) counts.set(i.status, (counts.get(i.status) || 0) + 1);
            const doneCount = items.length - open.length;
            const pct = items.length ? Math.round((100 * doneCount) / items.length) : 0;
            const bar = '█'.repeat(Math.round(pct / 10)) + '░'.repeat(10 - Math.round(pct / 10));

            // ---------- 4. Format ----------
            const md = d => d.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
            const fmt = (arr, { showOwner = true, showStatus = false } = {}) => {
              if (!arr.length) return '—';
              const lines = [];
              let len = 0;
              for (const [idx, x] of arr.entries()) {
                let line = `• ${x.label}`;
                if (showStatus && /block|stuck|waiting/i.test(x.status)) line = `• ⛔ ${x.label}`;
                if (showOwner) line += x.assignees.length ? ` — ${x.assignees.join(', ')}` : ' — *unassigned*';
                if (x.due) line += (!x.done && x.due < today) ? ` · 🔴 overdue ${md(x.due)}` : ` · ${md(x.due)}`;
                const more = `…and ${arr.length - idx} more`;
                if (len + line.length + more.length + 2 > 1000) { lines.push(more); break; }
                lines.push(line); len += line.length + 1;
              }
              return lines.join('\n');
            };
            const divider = { name: '\u200b', value: '━━━━━━━━━━━━━━━━━━━━━━' };

            const fields = [
              // — Wins —
              { name: `${closedTitle} (${closed.length})`, value: fmt(closed) },
              divider,
              // — Active —
              { name: `🔧 In progress (${inProgress.length})`, value: fmt(inProgress, { showStatus: true }) },
              { name: `📅 Due in the next ${lookahead} days (${dueSoon.length})`, value: fmt(dueSoon) },
            ];
            if (upNext.length) fields.push({ name: `📌 Assigned, not started (${upNext.length})`, value: fmt(upNext) });
            fields.push(
              divider,
              // — Needs attention —
              { name: `🙋 Unassigned open items (${unassigned.length})`, value: fmt(unassigned, { showOwner: false }) },
              { name: `🔴 Overdue (${overdue.length})`, value: fmt(overdue, { showStatus: true }) },
            );

            if (isMidweek) {
              const blocked = inProgress.filter(i => /block|stuck|waiting/i.test(i.status));
              fields.length = 0;
              if (unassigned.length) fields.push({ name: `🙋 Unassigned open items (${unassigned.length})`, value: fmt(unassigned, { showOwner: false }) });
              if (overdue.length) fields.push({ name: `🔴 Overdue (${overdue.length})`, value: fmt(overdue, { showStatus: true }) });
              if (blocked.length) fields.push({ name: `⛔ Blocked (${blocked.length})`, value: fmt(blocked) });
              if (!fields.length) fields.push({ name: '✅ All clear', value: 'Nothing unassigned, overdue, or blocked.' });
            }

            const statusLine = [...counts].map(([s, n]) => `${s} ${n}`).join(' · ') || 'Board is empty';
            let footer = `${statusLine}  |  ${bar} ${pct}% done (${doneCount}/${items.length})  |  Week of ${md(today)}`;
            if (hidden) footer += `  |  ⚠ ${hidden} item(s) hidden — token can't read them`;

            const embed = {
              title: `📋 ${project.title} — ${isMidweek ? 'Midweek Check' : 'Weekly Digest'}`,
              url: project.url,
              color: overdue.length ? 0xE5534B : 0x2EA043,
              fields,
              footer: { text: footer },
              timestamp: new Date().toISOString(),
            };

            // ---------- 5. Send ----------
            const resp = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: 'Cable Cruisers Bot', embeds: [embed], allowed_mentions: { parse: [] } }),
            });
            if (!resp.ok) core.setFailed(`Discord returned ${resp.status}: ${await resp.text()}`);
            else core.info(`Posted digest: ${items.length} items, ${overdue.length} overdue, ${dueSoon.length} due soon.`);
